name: Mac Image Builds

on:
  schedule:
    - cron: "30 8 * * *" # build at 8:30 UTC, off the desktop build's hour
  push:
    paths-ignore: # don't rebuild if only stuff the workflow doesn't run has changed
      - "**.md"
      - "/*.sh"
      - "iso-config/**"

  pull_request:
  workflow_dispatch: # allow manually triggering builds

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  mac-image-builds:
    name: Build Mac Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - floatblue-mac.yml
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          rechunk: true
          use_cache: true
