# Gaming overrides for the hardening set in 60-float-hardening.conf.
#
# Only two keys, and both are real blockers rather than nice-to-haves.
#
# kernel.io_uring_disabled = 2 turns io_uring off outright. It is off on the
# grounds that it has a long history of kernel bugs, which is fair, but Wine and
# Proton and several engines use it for ordinary file I/O and a good number of
# titles will not launch or will stutter badly. 1 keeps the syscall behind a
# permission check instead of removing it, which is the middle setting.
#
# vm.mmap_rnd_bits = 32 hard caps the randomised part of the mmap base at 32
# bits. That leaves too little address space for what modern Windows binaries
# ask for under DXVK, which reserves very large regions to emulate 64-bit
# addressing, and some of those allocations simply fail. Back to 28, the
# upstream default, which is already hardened relative to the old 28-less
# layouts and is what every current distro ships.
#
# Nothing here touches kexec, BPF, userfaultfd, tcp_timestamps or the ASLR
# setting itself. Those stay as the hardening file set them.

kernel.io_uring_disabled = 1

vm.mmap_rnd_bits = 28
vm.mmap_rnd_compat_bits = 16
