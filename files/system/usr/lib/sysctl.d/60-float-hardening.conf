# Kernel/network hardening, adapted from secureblue's 55-hardening.conf
# (https://github.com/secureblue/secureblue) to this image's constraints.
#
# Two rules shaped this file:
#
#  * Usable on old hardware. Nothing here is CPU-bound, and anything that
#    trades away a developer tool or a network diagnostic is deliberately left
#    out (see the omissions at the bottom).
#  * Usable as a daily desktop. sudo, su, pkexec, Xwayland and the firewall's
#    default services all stay; this file only changes kernel behaviour.
#
# systemd-sysctl(8) supports the `*` glob in interface names, which is how the
# per-interface settings below reach interfaces that appear after boot (USB
# Ethernet, Wi-Fi, VPN, docker/podman bridges).

# ---------------------------------------------------------------- network ---
# SYN flood protection.
net.ipv4.tcp_syncookies = 1
# Reject packets in the "martian" ranges RFC1337 describes, and drop ICMP
# errors for packets that were never sent.
net.ipv4.tcp_rfc1337 = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Broadcast smurf.
net.ipv4.icmp_echo_ignore_broadcasts = 1
# TCP timestamps off: it removes a known PAWS off-by-one, at the cost of a
# little loss of RTT measurement.
net.ipv4.tcp_timestamps = 0

# Anti-spoofing. Loose mode (2) rather than strict (1): on a laptop with
# Wi-Fi plus Ethernet plus a VPN, strict mode drops legitimate packets on the
# "wrong" interface and presents as "the internet randomly doesn't work".
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# ICMP redirects are a way to talk a host into becoming a router.
net.ipv4.conf.*.send_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0

# Source routing has no legitimate use on a desktop.
net.ipv4.conf.*.accept_source_route = 0
net.ipv6.conf.*.accept_source_route = 0

# Treat a machine as being on a point-to-point link, which stops it answering
# ARP for addresses it does not own.
net.ipv4.conf.*.arp_filter = 1
net.ipv4.conf.*.arp_ignore = 2
net.ipv4.conf.*.shared_media = 0
net.ipv4.conf.all.drop_gratuitous_arp = 1

# Log spoofed/source-routed/redirected packets.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# IPv6 privacy extensions: a temporary address per network.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# Harden the BPF JIT.
net.core.bpf_jit_harden = 2

# ----------------------------------------------------------------- kernel ---
# A process can only ptrace its own descendants (1). This is also Fedora's
# default; kept explicit because it is load-bearing for the sandboxing story.
kernel.yama.ptrace_scope = 1

# No unprivileged BPF.
kernel.unprivileged_bpf_disabled = 1

# No magic SysRq.
kernel.sysrq = 0

# perf is restricted to the caller's own processes (2). secureblue uses 3
# (nothing at all); 2 still blocks cross-process and kernel-wide sampling but
# keeps `perf` usable on your own workloads, which a developer image wants.
kernel.perf_event_paranoid = 2

# Do not leak kernel pointers through /proc or dmesg.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Cap the kernel's reaction to repeated oopses/warnings so a bad device cannot
# flood the console.
kernel.oops_limit = 100
kernel.warn_limit = 100

# Replace the running kernel with another one at runtime.
kernel.kexec_load_disabled = 1

# Keep error output readable; silences per-boot info spam on the console.
kernel.printk = 3 3 3 3

# No core files from the kernel side either.
kernel.core_pattern = |/bin/false

# Turn off the newer io_uring syscalls, which have a long CVE history. 2 is
# "disable the non-deprecated entry points". Nothing in a GNOME session needs
# io_uring, and reverting is one sysctl away if some app misbehaves.
kernel.io_uring_disabled = 2

# Address space layout hardening. randomize_va_space and mmap_min_addr are
# already Fedora defaults; repeated so the intent survives a base-image change.
kernel.randomize_va_space = 2
vm.mmap_min_addr = 65536
vm.max_map_count = 1048576
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# Restrict userfaultfd to processes with CAP_SYS_PTRACE.
vm.unprivileged_userfaultfd = 0

# ----------------------------------------------------------------- fs/dev ---
# No new binfmt_misc registrations.
fs.binfmt_misc.status = 0
# Setuid processes do not dump core.
fs.suid_dumpable = 0
# Hardened filesystem semantics (Fedora defaults, kept explicit).
fs.protected_regular = 2
fs.protected_fifos = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
# No line disciplines autoloaded from unprivileged users.
dev.tty.ldisc_autoload = 0

# --------------------------------------------------- deliberately omitted ---
# These are all in secureblue's hardening set and are NOT applied here, on
# purpose. Recorded so nobody "fixes" the gap without reading why:
#
#   net.ipv4.icmp_echo_ignore_all   Disables ping, i.e. removes ping, mtr-style
#                                   reachability checks and a chunk of this
#                                   image's network tooling.
#   kernel.panic = -1               Reboot on panic. On a laptop a hard reboot
#                                   is a worse outcome than a readable screen.
#   unprivileged_userns_clone=0     Would break Flatpak entirely: bubblewrap
#                                   needs unprivileged user namespaces.
#   perf_event_paranoid = 3         See above; breaks perf outright.
#   rp_filter = 1 (strict)          See above; breaks multi-homed desktops.
#   squashfs/nfs/cifs via modprobe  squashfs is load-bearing for ostree/bootc
#                                   and for the live ISO build; nfs/cifs break
#                                   network mounts.
#   sudo / su / pkexec removal      run0 starts a full systemd user session per
#                                   invocation, which is noticeably slow on an
#                                   i5-3550, and breaks ordinary scripting.
#   Xwayland off                     This image ships Steam.
