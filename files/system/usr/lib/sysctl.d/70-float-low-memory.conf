# Memory behaviour for a 3 to 4 GB machine.
#
# Every value here is chosen together with zram, which the low-end profile
# installs. zram is compressed swap held in RAM, so "swapping" no longer means
# touching the disk, which changes what the classic anti-swappiness tuning was
# for.

# With compressed RAM as the only swap, being reluctant to use it is the wrong
# instinct: keeping a cold page in RAM to avoid "swapping" it to a compressed
# and still-resident page just wastes memory that could hold something useful.
# 180 is the conventional figure for a zram-first setup.
vm.swappiness = 180

# Read a whole zram page in one request instead of 32 KB at a time. The page is
# already compressed and decompressing it repeatedly is the expensive part.
vm.page-cluster = 0

# Half the default pressure. The default keeps fewer dentry and inode caches,
# which suits a machine with memory to spare. On 4 GB, the caches for a desktop
# session are measured in hundreds of megabytes and caching them is usually the
# better trade.
vm.vfs_cache_pressure = 50

# Writeback sooner and in smaller bursts. The defaults assume a fast disk and a
# big buffer, and on an older or spinning disk they turn a burst of writes into
# a long stall instead of letting the disk catch up in the background.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# Do not read-ahead aggressively. An HDD on a small laptop should be allowed to
# spin down, and the aggressive default reads past the end of most small reads.
vm.laptop_mode = 5
