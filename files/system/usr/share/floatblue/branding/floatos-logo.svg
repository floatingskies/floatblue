<!--
  FloatOS mark, traced from branding/floatos-logo.png.

  Traced rather than embedded on purpose. The obvious way to make an SVG out of a
  PNG is to wrap the PNG in a base64 <image>, which is what ImageMagick does, and
  it produces a file that is an SVG only in name: it carries no vector data, so it
  cannot be recoloured, cannot be scaled cleanly and stays as heavy as the raster
  it hides. potrace gives real path data instead, 3 KB instead of 945 KB.

  The M reads as a hole because the white pixels were cut out of the mask before
  tracing, so they became real subpaths. Tracing the alpha channel alone gives one
  solid disc, since the whole disc is opaque and the M is white rather than
  transparent.

  Polarity matters and it is not obvious: PBM stores 1 as black, so the mask has to
  be negated on the way out. Without -negate potrace traces the background and
  returns the image frame as a single square.
-->
