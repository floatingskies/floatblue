# Fontconfig for design work.
#
# Bitmap fonts are off because GIMP, Inkscape and Blender all pick them up
# unprompted at small sizes and they look broken next to anything hinted.
# Antialiasing is forced on for the same reason: the defaults on a headless
# build container can end up with none of it, which shows up as thin,
# aliased type in a screenshot that then gets reviewed.

<match target="font">
  <edit name="antialias" mode="assign"><bool>true</bool></edit>
  <edit name="hinting" mode="assign"><bool>true</bool></edit>
  <edit name="hintingautofit" mode="assign"><bool>false</bool></edit>
  <edit name="rgba" mode="assign"><const>rgb</const></edit>
  <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
</match>

# Bitmap fonts only. TrueType and OpenType are hinted above and must stay.
<selectfont>
  <rejectfont>
    <glob>/usr/share/fonts/**/*.pcf</glob>
    <glob>/usr/share/fonts/**/*.pcf.gz</glob>
    <glob>/usr/share/fonts/**/*.bdf</glob>
    <glob>/usr/share/fonts/**/*.bdf.gz</glob>
  </rejectfont>
</selectfont>
