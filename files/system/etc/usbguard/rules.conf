# usbguard policy. Installed and NOT enabled, on purpose.
#
# Read this before you turn it on. A policy that blocks the class your keyboard
# is on takes the keyboard with it, and on a headless or remotely administered
# machine that is the whole session gone. That is the same reasoning as leaving
# the PAM stacks alone.
#
# To use it, review the allow rules, then:
#     sudo systemctl enable --now usbguard.service
#
# The deny-all rule is last, so anything not explicitly allowed above is blocked.
# Test with a USB stick before you reboot into it.

# Allowed by class. Storage, input, and the audio and video classes that audio
# interfaces, webcams and capture cards present themselves as.
<allow class="mass_storage" />
<allow class="hid" />
<allow class="audio" />
<allow class="video" />
<allow class="comm" />

# Block anything the kernel does not have a class for. These are the devices that
# show up with no class at all and are the ones worth looking at by hand.
<allow class="none" />

# Allow the devices the machine itself needs regardless of class: the platform
# devices, the hubs the built-in ports sit behind, and anything the firmware
# reports as trusted.
<allow iface="{ 1d6b }" />        # root hub
<allow iface="{ 1d6b - }" />      # internal hubs
<allow iface="{ 0000:00:14.0 }" /> # USB host controller

# Block everything else.
<reject />
