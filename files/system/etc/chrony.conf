# chrony configured for Network Time Security, modelled on secureblue's
# chrony.conf (https://github.com/secureblue/secureblue).
#
# NTS authenticates and encrypts the time feed over UDP/4460, so a network
# cannot push a bogus clock at this machine. This matters more than it looks:
# TLS certificate validation, TOTP/2FA and log forensics all trust the clock.
#
# `authselectmode prefer` is what makes chrony accept NTS while still working
# if a given server only offers plain NTP.

# NIST, plain NTP, used as a bootstrap and as a fallback.
server 129.6.15.27 iburst

# NTS-capable pools. Any one of these is enough; minsources below requires
# agreement between several before the clock is trusted.
server time.cloudflare.com iburst nts
server ntppool1.time.nl iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts

# Do not believe the system clock until NTP has corrected it at least once, so
# a machine that booted with a badly wrong RTC cannot fail TLS first.
makestep 1.0 3

minsources 3

# Leap seconds from the system tzdata, kept up to date.
leapseclist /usr/share/zoneinfo/leap-seconds.list

driftfile /var/lib/chrony/drift
dumpdir /var/lib/chrony
ntsdumpdir /var/lib/chrony

# Keep the RTC in UTC.
rtconutc
rtcsync

# No remote administration port.
cmdport 0
