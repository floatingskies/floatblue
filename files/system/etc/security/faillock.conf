# Lock an account after repeated failed logins.
#
# Fedora already wires pam_faillock into system-auth/password-auth (preauth +
# authfail), so dropping this file in is enough — no PAM stack is rewritten
# here, deliberately: a botched edit to /etc/pam.d/* locks you out of the
# graphical login and the only way back is a live USB.
#
# unlock_time is 900s, not secureblue's 24h. A 24h lockout triggered by fat
# fingers on a laptop is not "secure", it is a support call.
deny = 10
unlock_time = 900
# Only count failures that are at least this far apart, so one burst of retries
# is one failure, not ten.
fail_interval = 900
# Never lock root out; a locked root cannot be unlocked from the console.
deny_root = no
# Leave audit records behind for anyone who cares to look.
dir = /var/log/faillock/
