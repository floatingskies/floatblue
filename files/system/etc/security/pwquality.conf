# Password quality. pam_pwquality is already in Fedora's default PAM stack for
# password changes, so this takes effect without touching /etc/pam.d.
minlen = 12
minclass = 2
maxrepeat = 3
# Reject passwords containing the username, and the obvious substitutions.
dictcheck = 1
usercheck = 1
enforcing = 1
retry = 3
