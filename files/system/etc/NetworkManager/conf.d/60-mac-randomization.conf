# Randomize the Wi-Fi MAC address per network.
#
# "random" + "stable" gives a random address that is then remembered per
# network: networks that key on the MAC (many corporate and guest APs do)
# keep working, while a passive observer cannot follow this machine across
# networks by its hardware address. "random" alone would change on every
# reconnect and constantly drop the AP association.
#
# This sets the default for connections created from now on. Profiles already
# on disk are updated by set-network-mac-randomization.sh at build time.
[connection]
wifi.cloned-mac-address=random
wifi.cloned-mac-address-flags=stable
