# zram size for a 3 to 4 GB machine.
#
# Half of RAM, but never more than 2 GB and never less than 512 MB. Half is the
# usual advice and it is right here: zram is compressed, so the worst realistic
# case for incompressible data still lands well under the nominal size, and on a
# 4 GB machine you cannot afford much more than this before zram itself starts
# to cost more than it saves.
#
# The priority is 100 so the compressed device is used before any real swap
# file. If this machine has an actual swap partition, zram should still win:
# RAM beats disk for the same job.
[zram0]
zram-size = min(ram / 2, 2048)
compression-algorithm = zstd
swap-priority = 100
