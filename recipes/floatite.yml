# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: floatite
# description will be included in the image's metadata
description: Bazzite (GNOME) with my personal preferences baked in. This bootable container image follows Bazzite's latest image channel.
alt-tags:
  - latest

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-dx-gnome
image-version: latest

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - from-file: features/system-files.yml
  - from-file: features/application-rpms.yml
  - from-file: features/devops.yml
  - from-file: features/cockpit.yml
  - from-file: features/fonts.yml
  - from-file: features/branding.yml
  - from-file: features/theming.yml
  - from-file: features/wallpapers.yml
  - from-file: features/hardening.yml
  - from-file: features/networking.yml
  - from-file: features/codecs.yml
  - from-file: features/brew.yml
  - from-file: features/flatpaks.yml
  - type: gschema-overrides  # Float defaults: Intel One Mono interface font
    include:
      - zz42-float.gschema.override
  - type: script
    scripts:
      - ublue-disable-steam-autostart.sh
