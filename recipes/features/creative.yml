# For design work: raster, vector, 3D, and the colour management to go with them.
#
# Every dnf module here is skip-unavailable. Package sets move between Fedora
# releases and a missing editor should not cost you the whole image, which is
# the same reason the theming and unix-tooling modules work that way.

modules:
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        # Raster
        - gimp
        - krita
        - darktable
        - rawtherapee
        - digikam
        # Vector
        - inkscape
        - scribus
        # 3D
        - blender
        # Colour management. colord is the daemon and it ships its own ICC
        # profiles: AdobeRGB1998, ProPhotoRGB and Rec709 all land in
        # /usr/share/color/icc/colord from this one package. There is no
        # colord-icc-profiles-free, that name was wrong, and a package that does
        # not exist is not something to leave in a recipe.
        - colord
        - colord-libs
        # Batch and metadata
        - ImageMagick
        - GraphicsMagick
        - perl-Image-ExifTool
        - file-roller

  - type: files
    files:
      - source: system/etc/fontconfig/conf.d/62-float-design.conf
        destination: /etc/fontconfig/conf.d/62-float-design.conf

  - type: script
    scripts:
      - apply-design-tuning.sh
