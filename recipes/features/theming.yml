
modules:
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - libadwaita
        - adwaita-cursor-theme
        - adwaita-icon-theme

  - type: gnome-extensions
    install:
      - User Themes

  - type: gschema-overrides
    include:
      - zz500-float-theme.gschema.override

  # Installed here rather than left to the ublue overrides block further down,
  # because apply-desktop-dconf.sh has to run "dconf update" after this file
  # exists, and that block comes later in the build order.
  - type: files
    files:
      - source: dconf-ublue/10-float-desktop
        destination: /etc/dconf/db/distro.d

  - type: script
    scripts:
      - install-flat-remix-themes.sh
      - enable-user-theme-systemwide.sh
      - seed-user-theme.sh
      - apply-desktop-dconf.sh
      - apply-flatpak-theme-access.sh

  - type: systemd
    system:
      enabled:
        # dconf update compiles distro.d into a binary database, so a keyfile
        # dropped in after it ran is simply ignored. Running it again at boot
        # means whatever is on disk when the greeter starts is what the greeter
        # gets, no matter which recipe added it or in what order.
        - float-dconf-update.service
    user:
      enabled:
        - float-theme-sync.service
