
# Theming.
#
# The desktop runs stock Adwaita. That used to be Flat Remix, a third-party theme,
# and it was the wrong dependency for a long-lived image: it is maintained outside
# GNOME, so every GNOME release that changed a widget class or a libadwaita CSS
# rule could leave the theme stale or visibly broken, and the fix was always to wait
# for someone else. Adwaita ships with the platform, so it cannot drift from it.
#
# The wallpapers are what carry the colour now. The Floatblue set is drawn from a
# set of named palettes and the Firewatch set is flat banded landscape, so the
# desktop has plenty of colour in it without the widgets having to supply more.
# Neutral widgets also let a wallpaper be looked at, which is the point of having
# a background at all.

modules:
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        # Already in the base on a GNOME image. Named explicitly rather than assumed,
        # because this recipe now states what the desktop is made of instead of
        # leaving it to whatever the base happened to ship.
        - adwaita-icon-theme
        - adwaita-cursor-theme
        - libadwaita

  - type: gschema-overrides
    include:
      # Pins Adwaita rather than leaving it to the base. Bluefin sets a font and a
      # colour scheme of its own, and an image that means to be stock should say so
      # in a file it owns instead of hoping the base agrees.
      - zz500-float-theme.gschema.override

  # Both keyfiles have to exist before apply-desktop-dconf.sh runs "dconf update",
  # which is why they are here rather than in a later block.
  - type: files
    files:
      - source: dconf-ublue/10-float-desktop
        destination: /etc/dconf/db/distro.d
      # Logo-menu configuration, including the FloatOS mark. This file was in the
      # repo the whole time but never reached the image: ublue-overrides.yml
      # copies the whole dconf-ublue directory, and the only recipe that pulled
      # that module in was ublue-features.yml, which nothing references. So the
      # panel had been showing the Universal Blue logo because nothing overrode it.
      - source: dconf-ublue/04-gnome-logo-menu
        destination: /etc/dconf/db/distro.d

  - type: script
    scripts:
      - apply-logo-menu-brand.sh
      - apply-desktop-dconf.sh

  - type: systemd
    system:
      enabled:
        # dconf update compiles distro.d into a binary database, so a keyfile
        # dropped in after it ran is simply ignored. Running it again at boot means
        # whatever is on disk when the greeter starts is what the greeter gets, no
        # matter which recipe added it or in what order.
        - float-dconf-update.service
        # Takes the theming plumbing out again on installs that rebased onto an
        # older image. A build step cannot do this: it would write into the image
        # being built, and bootc switch leaves an install's own /etc and home
        # alone. Adwaita needs none of it, so the leftovers are just dead config.
        - float-remove-theme-access.service
    user:
      enabled:
        # The per-user half: ~/.config/gtk-4.0/gtk.css and
        # ~/.local/share/flatpak/override only exist inside a session.
        - float-remove-theme-access.service
