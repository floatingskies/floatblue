# A different name from the desktop recipes on purpose. bluebuild uses this for
# the image it pushes, so sharing it would put the Mac build and the desktop build
# on the same tags and whichever finished last would win for both.
name: floatblue-mac
description: Bluefin's GNOME on a Silverblue base, with the Broadcom WiFi and the rest that Intel Macs need, for the ones macOS has finished with.
alt-tags:
  - mac
  - stable-mac

# Silverblue, not Bluefin DX. Same Fedora underneath, without a desktop stack
# tuned for a discrete GPU and a network configuration this hardware does not
# want. Everything we added is layered on top through the shared feature list, so
# the branding, the theme, the wallpapers and the profiles are identical.
base-image: ghcr.io/ublue-os/silverblue-main

# Not "stable", because Silverblue has no such tag. Its channels are gts, latest
# and the plain Fedora numbers. Using stable here fails before the build starts:
#
#   Failed to pull the manifest for ghcr.io/ublue-os/silverblue-main:stable
#   OCI API error: manifest unknown
#
# image-version picks the tag of the base image and is also what lands on the
# output, so it has to be a real Silverblue channel. gts is the closest thing to
# stable that Silverblue actually ships, and the pinned Fedora numbers are there
# when a fully reproducible base matters more than staying current.
image-version: gts

modules:
  - from-file: features/ublue-bluefin-features.yml
  - from-file: features/mac-hardware.yml
  - type: gschema-overrides  # Intel One Mono, same as the desktop channels
    include:
      - zz42-float.gschema.override
